<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1117">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Streams</title>
<style>
  :root {
    --bg: #0d1117; --card: #161b22; --line: #30363d; --fg: #e6edf3; --dim: #8b949e;
    --running: #ffd33d; --loop: #ffd33d; --stalled: #ff9500; --done: #2ea043; --error: #da3633; --idle: #30363d; --waiting: #79c0ff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { overflow-x: hidden; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", Helvetica, sans-serif;
         padding: calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 24px); }
  header { display: flex; align-items: center; gap: 10px; margin: 4px 0 12px; }
  header h1 { font-size: 22px; margin: 0; font-weight: 800; letter-spacing: -0.02em; }
  .conn { width: 9px; height: 9px; border-radius: 50%; background: var(--error); }
  .conn.on { background: var(--done); }
  .grow { flex: 1; }
  .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 8px; scrollbar-width: none; }
  .tab { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; }
  .tab.on { border-color: var(--fg); }
  .tab .n { color: var(--dim); margin-left: 4px; }
  .tab.stale { opacity: .5; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }
  .chip { border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 800; }
  .k-running, .k-loop, .k-stalled { color: #000; } .k-done, .k-error { color: #fff; } .k-idle { color: #c9d1d9; } .k-waiting { color: #08203a; }
  .bg-running { background: var(--running); } .bg-loop { background: var(--loop); } .bg-stalled { background: var(--stalled); }
  .bg-done { background: var(--done); } .bg-error { background: var(--error); } .bg-idle { background: var(--idle); } .bg-waiting { background: var(--waiting); }
  .card { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 14px; margin-bottom: 10px; overflow: hidden; }
  .card > .head { display: flex; align-items: center; gap: 12px; padding: 12px; cursor: pointer; }
  .card .body { display: none; } .card.open .body { display: block; }
  .chev { color: var(--dim); font-size: 12px; }
  .icon { flex: none; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-weight: 900; color: #111; background: var(--c); }
  .icon.spin { background: none; border: 4px solid #3a3a46; border-top-color: var(--running); border-radius: 50%; animation: spin 1.1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .title { flex: 1; min-width: 0; }
  .name { font-weight: 700; color: var(--c); }
  .detail { color: var(--dim); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { flex: none; border-radius: 6px; padding: 2px 7px; font-size: 11px; font-weight: 800; text-transform: uppercase; }
  .body { padding: 0 12px 12px; border-top: 1px solid var(--line); }
  .question { margin: 0 12px 12px; border: 1px solid var(--waiting); border-radius: 10px; padding: 10px; }
  .agent { display: flex; gap: 8px; align-items: baseline; padding: 8px 0 0; font-size: 13px; }
  .agent .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; }
  .agent .what { flex: 1; min-width: 0; }
  .agent .last { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row { padding: 8px 0 0; font-size: 13px; white-space: pre-wrap; word-break: break-word; }
  .row.prompt { color: var(--fg); font-weight: 600; }
  .row.prompt::before { content: "› "; color: var(--c); }
  .row.reply { color: #c9d1d9; }
  .row.tool, .row.agent-row, .row.loop, .row.notice { color: var(--dim); font: 12px/1.35 ui-monospace, Menlo, monospace; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 18px 0 8px; }
  .status { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px 12px 10px; }
  .srow { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .srow:last-child { border-bottom: 0; }
  .srow .area { font-weight: 700; }
  .srow .state { font-weight: 800; font-size: 12px; text-align: right; }
  .srow .sdetail { grid-column: 1 / -1; color: var(--dim); font-size: 13px; }
  .limit { display: grid; grid-template-columns: 3.5em 1fr 3em; gap: 2px 10px; align-items: center; padding: 6px 0; font-size: 13px; }
  .limit .pct { text-align: right; font-weight: 700; }
  .limit .reset { grid-column: 2 / -1; }
  .bar { height: 8px; border-radius: 4px; background: #262c36; overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 4px; }
  .empty { color: var(--dim); text-align: center; padding: 40px 0; }
  .gate { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px 18px; margin: 12px 0 16px; text-align: center; }
  .gate h2 { margin: 0 0 6px; font-size: 20px; text-transform: none; letter-spacing: 0; color: var(--fg); }
  .gate p { color: var(--dim); margin: 0 0 16px; }
  .gate .btn { font-size: 17px; padding: 12px 20px; }
  .lock { color: var(--dim); font-size: 12px; text-align: center; margin: 18px 0 0; }
  .btn { font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 9px 14px; color: #111; background: var(--fg); }
  .btn.yes, .btn.allow { background: var(--done); color: #fff; }
  .btn.deny, .btn.stop { background: var(--error); color: #fff; }
  .btn.ghost { background: none; color: var(--fg); border: 1px solid var(--line); }
  .btn:disabled { opacity: .5; }
  .actions { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  .reply { display: flex; gap: 8px; margin-top: 10px; }
  .reply textarea { flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--fg); background: #0d1117; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; resize: none; }
  .perm { background: #2a1f00; border: 1px solid var(--running); border-radius: 14px; padding: 12px; margin-bottom: 10px; }
  .perm .what { font: 13px/1.4 ui-monospace, Menlo, monospace; word-break: break-word; margin: 6px 0 0; }
  .perm-head { display: flex; align-items: baseline; gap: 10px; }
  .perm .left { color: var(--dim); font-size: 12px; margin-left: auto; white-space: nowrap; }
  .sent { color: var(--done); font-size: 13px; }
  .session-bar { display: flex; align-items: center; gap: 10px; margin: -2px 0 10px; }
  .views { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; margin-bottom: 10px; }
  .views button { font: inherit; font-size: 14px; font-weight: 700; color: var(--dim); background: none; border: 0; border-radius: 8px; padding: 6px 14px; }
  .views button.on { background: var(--line); color: var(--fg); }
  .sgroup { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 14px 0 4px; }
  .usage { position: fixed; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px);
           border-top: 1px solid var(--line); padding: 10px 16px calc(env(safe-area-inset-bottom) + 10px); cursor: pointer; }
  .usage-row { display: flex; align-items: center; gap: 14px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .usage-row .u { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .usage-row .mini { width: 44px; height: 6px; border-radius: 3px; background: #262c36; overflow: hidden; flex: none; }
  .usage-row .mini > i { display: block; height: 100%; }
  .usage .more { padding-top: 6px; }
  body.has-usage { padding-bottom: calc(env(safe-area-inset-bottom) + 64px); }
  body.has-usage.usage-open { padding-bottom: calc(env(safe-area-inset-bottom) + 170px); }
  .stale-note { color: var(--stalled); font-size: 12px; margin: -4px 0 10px; }
</style>
</head>
<body>
<header><h1>Streams</h1><span class="grow"></span><span id="conn" class="conn" title="connection"></span></header>
<nav id="tabs" class="tabs"></nav>
<div id="gate" class="gate" hidden></div>
<main id="main"><p class="empty">Waiting for the bridge…</p></main>
<script type="module">
import * as Seal from '/seal.js'
const GLYPH = { running: '●', loop: '↻', waiting: '?', error: '✗', stalled: '◌', done: '✓', idle: '○' }
const STATE_COLOR = { running: '#ffd33d', loop: '#ffd33d', stalled: '#ff9500', done: '#2ea043', error: '#ff7b72', idle: '#8b949e', waiting: '#79c0ff' }
const ROW_CLASS = { prompt: 'prompt', reply: 'reply', tool: 'tool', agent: 'agent-row', loop: 'loop', notice: 'notice' }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
const keep = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} },
}
let sessions = []
const drafts = {}
let view = keep.get('cf:view', 'streams')
let usageOpen = keep.get('cf:usage', false)
let pendingRender = false
const sentAt = {}
let stopArmed = 0
let chosen = keep.get('cf:session', '')
const open = new Set(keep.get('cf:open', []))

const clock = ms => {
  const m = Math.floor(ms / 60000), s = Math.floor(ms / 1000) % 60
  return m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : m ? `${m}m ${s}s` : `${s}s`
}
const ago = (now, at) => clock(Math.max(0, now - at)) + ' ago'
const short = ms => { const s = Math.max(0, Math.round(ms / 1000)); return s < 60 ? `${s}s` : s < 3600 ? `${Math.round(s / 60)}m` : s < 86400 ? `${Math.round(s / 3600)}h` : `${Math.round(s / 86400)}d` }
/** The detail with its clock, counted here so it moves between snapshots. */
const detailOf = s => {
  const now = Date.now()
  if (s.nextAt) return `next tick in ${short(s.nextAt - now)}${s.detail ? ` · ${s.detail}` : ''}`
  if (s.kind === 'running') return s.detail
  return `${s.detail || '—'} · ${short(now - s.lastAt)} ago`
}
const limitColor = p => (p >= 80 ? '#ff7b72' : p >= 50 ? '#ffd33d' : '#7ee787')

function card(s, now) {
  const isOpen = open.has(s.id)
  const icon = s.kind === 'running' ? '<span class="icon spin"></span>' : `<span class="icon">${GLYPH[s.kind] ?? '○'}</span>`
  const agents = s.agents.map(a => `
    <div class="agent">
      <span class="dot" style="background:${STATE_COLOR[a.status]}"></span>
      <div class="what"><div>${esc(a.description)}</div><div class="last">${esc(a.last)}</div></div>
      <span class="meta">${a.tools} tools · ${clock(a.ms)}</span>
    </div>`).join('')
  const rows = s.rows.map(r => `<div class="row ${ROW_CLASS[r.kind] ?? ''}">${esc(r.text)}</div>`).join('')
  return `
  <section class="card ${isOpen ? 'open' : ''}" data-id="${esc(s.id)}" style="--c:${esc(s.color)}">
    <div class="head" data-toggle="${esc(s.id)}">
      ${icon}
      <div class="title"><div class="name">${esc(s.name)}</div>${s.question ? '' : `<div class="detail">${esc(detailOf(s))}</div>`}</div>
      <span class="badge bg-${s.kind} k-${s.kind}">${s.kind === 'waiting' ? 'waiting' : esc(s.state)}</span>
      <span class="chev">${isOpen ? '▾' : '▸'}</span>
    </div>
    ${s.question ? `<div class="question">${esc(s.question)}
      <div class="actions"><button class="btn yes" data-answer="${esc(s.id)}" data-text="yes">Yes</button>
      <button class="btn ghost" data-reply-open="${esc(s.id)}">Reply…</button>${sentNote(s.id)}</div></div>` : ''}
    <div class="body">${agents}${rows || '<div class="row reply">Nothing filed yet.</div>'}${replyBox(s.id)}</div>
  </section>`
}

/** The reply box under an opened card (or a waiting one whose Reply was tapped), its draft kept across redraws. */
function replyBox(id) {
  return `<div class="reply"><textarea rows="2" placeholder="Reply in this stream…" data-draft="${esc(id)}">${esc(drafts[id] ?? '')}</textarea>
    <button class="btn" data-send="${esc(id)}">Send</button></div>`
}
const sentNote = id => (sentAt[id] && Date.now() - sentAt[id] < 8000 ? '<span class="sent">✓ sent</span>' : '')

/** Permission prompts the session holds for this phone: allow or deny, with the time left before the Mac asks instead. */
function permBlock(x) {
  return (x.permissions ?? []).map(p => `
    <div class="perm"><div class="perm-head"><b>Claude wants to run ${esc(p.tool)}</b><span class="left">${Math.max(0, Math.round((p.at + 60000 - Date.now()) / 1000))}s left</span></div>
      <div class="what">${esc(p.summary)}</div>
      <div class="actions"><button class="btn allow" data-perm="${esc(p.id)}" data-decision="allow">Allow</button>
      <button class="btn deny" data-perm="${esc(p.id)}" data-decision="deny">Deny</button></div></div>`).join('')
}

const srow = (area, state, color, detail) => `
    <div class="srow"><span class="area">${esc(area)}</span>
      <span class="state" style="color:${color}">${esc(state)}</span>
      <span class="sdetail">${esc(detail)}</span></div>`

/** The status card, as the terminal's: git, then tickets, then every stream, what needs you first. */
function statusView(x) {
  const git = x.status.filter(l => !l.kind)
  const tickets = x.status.filter(l => l.kind)
  const group = (name, rows) => (rows.length ? `<div class="sgroup">${name}</div><div class="status">${rows.join('')}</div>` : '')
  return group('Git', git.map(l => srow(l.area, l.state, '#a5d8ff', l.detail)))
    + group('Tickets', tickets.map(l => srow(l.area, l.state, STATE_COLOR[l.kind], l.detail)))
    + group('Streams', x.streams.map(s => srow(s.name, s.kind === 'waiting' ? 'WAITING' : s.state, STATE_COLOR[s.kind], s.question || detailOf(s))))
    || '<p class="empty">Nothing to report yet.</p>'
}

/** Plan usage, pinned to the bottom: one row of mini bars; a tap shows each limit with when it resets. */
function usageBar(x) {
  if (!x.limits.length) return ''
  const row = x.limits.map(l => `<span class="u"><span class="meta">${esc(l.label)}</span>
      <span class="mini"><i style="width:${Math.min(100, l.percent)}%;background:${limitColor(l.percent)}"></i></span>
      <b style="color:${limitColor(l.percent)}">${l.percent}%</b></span>`).join('')
  const more = x.limits.map(l => `
    <div class="limit"><span class="meta">${esc(l.label)}</span>
      <span class="bar"><i style="width:${Math.min(100, l.percent)}%;background:${limitColor(l.percent)}"></i></span>
      <span class="pct" style="color:${limitColor(l.percent)}">${l.percent}%</span>
      ${l.resetsIn ? `<span class="meta reset">resets in ${esc(l.resetsIn)} · ${esc(l.resetsAt)}</span>` : ''}</div>`).join('')
  return `<div class="usage" data-usage role="button" aria-expanded="${usageOpen}" tabindex="0">
    <div class="usage-row"><span class="meta">Plan usage</span>${row}<span class="grow"></span><span class="chev">${usageOpen ? '▾' : '▴'}</span></div>
    ${usageOpen ? `<div class="more">${more}</div>` : ''}</div>`
}

function render() {
  // Redrawing would drop the keyboard mid-word: wait until the box loses focus.
  if (document.activeElement?.matches?.('textarea')) { pendingRender = true; return }
  pendingRender = false
  const tabs = document.getElementById('tabs')
  const main = document.getElementById('main')
  if (!sessions.length) {
    tabs.innerHTML = ''
    main.innerHTML = '<p class="empty">No sessions yet. Open Claude Code with the streams mod on the Mac.</p>'
    return
  }
  const x = sessions.find(s => s.session.id === chosen) ?? sessions[0]
  tabs.innerHTML = sessions.map(s => {
    const live = s.streams.filter(t => t.kind === 'running' || t.kind === 'waiting').length
    return `<button class="tab ${s === x ? 'on' : ''} ${s.isStale ? 'stale' : ''}" data-session="${esc(s.session.id)}">
      ${s.session.busy ? '● ' : ''}${esc(s.session.account)} · ${esc(s.session.project)}${live ? `<span class="n">${live}</span>` : ''}</button>`
  }).join('')
  const counts = ['waiting', 'running', 'loop', 'error', 'stalled', 'done']
    .map(k => [k, x.streams.filter(s => s.kind === k).length]).filter(([, n]) => n)
  main.innerHTML = `
    ${x.session.busy && !x.isStale ? `<div class="session-bar"><span class="meta">Claude is working</span><span class="grow"></span>
      <button class="btn stop" data-stop>${Date.now() - stopArmed < 4000 ? 'Tap again to stop' : '■ Stop'}</button></div>` : ''}
    ${permBlock(x)}
    ${x.isStale ? `<p class="stale-note">Not heard from for ${ago(Date.now(), x.seen)}: the session may have ended.</p>` : ''}
    <div class="chips">${counts.map(([k, n]) => `<span class="chip bg-${k} k-${k}">${GLYPH[k]} ${n} ${k}</span>`).join('')}</div>
    <div class="views" role="tablist"><button data-view="streams" class="${view === 'streams' ? 'on' : ''}">Streams</button><button data-view="status" class="${view === 'status' ? 'on' : ''}">Status</button></div>
    ${view === 'status' ? statusView(x) : x.streams.length ? x.streams.map(s => card(s, x.at)).join('') : '<p class="empty">Streams appear as you prompt.</p>'}
    ${usageBar(x)}`
  document.body.classList.toggle('has-usage', x.limits.length > 0)
  document.body.classList.toggle('usage-open', usageOpen)
}

const current = () => sessions.find(s => s.session.id === chosen) ?? sessions[0]

/** Sends the session one command through the bridge; the page shows it was sent, the stream shows what came of it. */
async function send(command) {
  const x = current()
  if (!x) return false
  return transport.send({ session: x.session.id, ...command })
}

document.addEventListener('input', e => {
  const d = e.target.closest?.('[data-draft]')
  if (d) drafts[d.dataset.draft] = d.value
})
document.addEventListener('focusout', () => setTimeout(() => { if (pendingRender) render() }, 0))

document.addEventListener('click', async e => {
  const answer = e.target.closest('[data-answer]')
  if (answer) {
    answer.disabled = true
    if (await send({ kind: 'answer', streamId: answer.dataset.answer, text: answer.dataset.text })) sentAt[answer.dataset.answer] = Date.now()
    render()
    return
  }
  const sendBtn = e.target.closest('[data-send]')
  if (sendBtn) {
    const id = sendBtn.dataset.send
    const text = (drafts[id] ?? '').trim()
    if (!text) return
    sendBtn.disabled = true
    if (await send({ kind: 'answer', streamId: id, text })) { sentAt[id] = Date.now(); drafts[id] = '' }
    document.activeElement?.blur?.()
    render()
    return
  }
  const replyOpen = e.target.closest('[data-reply-open]')
  if (replyOpen) {
    open.add(replyOpen.dataset.replyOpen)
    render()
    document.querySelector(`[data-draft="${CSS.escape(replyOpen.dataset.replyOpen)}"]`)?.focus()
    return
  }
  const perm = e.target.closest('[data-perm]')
  if (perm) {
    perm.parentElement.querySelectorAll('button').forEach(b => (b.disabled = true))
    const ok = await send({ kind: 'permission', requestId: perm.dataset.perm, decision: perm.dataset.decision })
    if (!ok) perm.parentElement.querySelectorAll('button').forEach(b => (b.disabled = false))
    return
  }
  const gateBtn = e.target.closest('[data-gate]')
  if (gateBtn) { gateBtn.disabled = true; await transport.gate?.(gateBtn.dataset.gate); return }
  if (e.target.closest('[data-stop]')) {
    // Two taps, no dialog: a stray touch does not stop a turn.
    if (Date.now() - stopArmed < 4000) { stopArmed = 0; await send({ kind: 'stop' }) } else stopArmed = Date.now()
    render()
    return
  }
  const v = e.target.closest('[data-view]')
  if (v) { view = v.dataset.view; keep.set('cf:view', view); render(); return }
  if (e.target.closest('[data-usage]')) { usageOpen = !usageOpen; keep.set('cf:usage', usageOpen); render(); return }
  const tab = e.target.closest('[data-session]')
  if (tab) { chosen = tab.dataset.session; keep.set('cf:session', chosen); render() }
  const head = e.target.closest('[data-toggle]')
  if (head) {
    const id = head.dataset.toggle
    open.has(id) ? open.delete(id) : open.add(id)
    keep.set('cf:open', [...open])
    render()
  }
})

const dot = () => document.getElementById('conn')

/** The page on the Mac's own bridge (Tailscale or this Mac): a websocket for news, a POST for commands. */
function localTransport() {
  let ws
  const seen = () => { if (document.visibilityState === 'visible' && ws?.readyState === 1) ws.send('{"type":"visible"}') }
  function connect() {
    ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`)
    ws.onopen = () => { dot().classList.add('on'); seen() }
    ws.onmessage = m => {
      const msg = JSON.parse(m.data)
      if (msg.type === 'sessions') { sessions = msg.sessions; render() }
    }
    ws.onclose = () => { dot().classList.remove('on'); setTimeout(connect, 2000) }
  }
  setInterval(seen, 10000)
  document.addEventListener('visibilitychange', seen)
  return {
    start: connect,
    async send(body) {
      const r = await fetch('/api/command', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }).catch(() => undefined)
      return !!r?.ok
    },
  }
}

/**
 * The page served by the relay: everything to and from the Mac is sealed with keys only the Mac and this phone hold.
 * Pairing makes a passkey; each connection is unlocked with it, and every Allow signs a fresh challenge from the Mac.
 */
function relayTransport(pairing) {
  let ws, ch, eph, nonce, unlockChallenge, allowChallenge
  const save = () => keep.set('cf:pair', pairing)
  const gate = html => { const g = document.getElementById('gate'); g.hidden = !html; g.innerHTML = html || '' }
  const b = Seal.b64u
  const assert = async challenge => {
    const c = await navigator.credentials.get({ publicKey: {
      challenge: b.dec(challenge), rpId: location.hostname, userVerification: 'required',
      allowCredentials: [{ type: 'public-key', id: b.dec(pairing.credentialId) }],
    } })
    return { authenticatorData: b.enc(c.response.authenticatorData), clientDataJSON: b.enc(c.response.clientDataJSON), signature: b.enc(c.response.signature) }
  }
  const sealed = async obj => ws?.readyState === 1 && ch && ws.send(JSON.stringify({ t: 'box', b: await ch.seal(obj) }))
  async function hello(extra = {}) {
    eph = await Seal.newKeyPair()
    nonce = Seal.randomId()
    ws.send(JSON.stringify({ t: 'hello', phonePub: pairing.key.pub, ephPub: await Seal.exportPub(eph.publicKey), nonce, ...extra }))
  }
  async function connect() {
    if (!pairing.key) { pairing.key = await Seal.exportPair(await Seal.newKeyPair()); save() }
    ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/phone?mac=${pairing.mac}&id=${pairing.phone}`)
    ch = undefined
    ws.onopen = () => {
      dot().classList.add('on')
      if (pairing.credentialId) hello()
      else gate(`<h2>Pair this phone</h2><p>Create a passkey for Claudeflow. You'll use Face ID or your passcode to open it and to allow Claude's actions.</p><button class="btn yes" data-gate="pair">Create passkey</button>`)
    }
    ws.onmessage = async m => {
      const msg = JSON.parse(m.data)
      if (msg.t === 'denied') {
        gate(`<h2>This phone isn't paired</h2><p>${msg.why === 'not paired' ? 'The code has expired or was used. Run <b>/streams phone</b> on your Mac and scan the new code.' : esc(msg.why)}</p>`)
        delete pairing.credentialId
        save()
        return
      }
      if (msg.t === 'welcome') {
        const own = await Seal.importPair(pairing.key)
        const keys = await Seal.connectionKeys({ ownStatic: own, peerStaticPub: pairing.macPub, ownEphemeral: eph, peerEphemeralPub: msg.ephPub, macNonce: msg.nonce, phoneNonce: nonce })
        ch = Seal.channel(keys.phoneToMac, keys.macToPhone)
        unlockChallenge = msg.challenge
        // Paired once: the one-time secret is spent, so it is not kept.
        if (pairing.secret) { delete pairing.secret; save() }
        gate(`<h2>Locked</h2><p>Unlock with your passkey to see your sessions.</p><button class="btn yes" data-gate="unlock">Unlock</button>`)
        return
      }
      if (msg.t === 'box' && ch) {
        const x = await ch.open(msg.b).catch(() => undefined)
        if (!x) return
        if (x.t === 'sessions') { gate(''); sessions = x.sessions; render(); prefetch() }
        else if (x.t === 'challenge') allowChallenge = x.challenge
        else if (x.t === 'locked') gate(`<h2>Locked</h2><p>${esc(x.why)}</p><button class="btn yes" data-gate="unlock">Try again</button>`)
      }
    }
    ws.onclose = () => { dot().classList.remove('on'); setTimeout(connect, 2000) }
  }
  // An Allow needs a fresh challenge from the Mac, fetched as soon as a prompt shows, so the tap goes straight to Face ID.
  function prefetch() {
    if (!allowChallenge && sessions.some(x => (x.permissions ?? []).length)) sealed({ t: 'challenge' })
  }
  setInterval(() => { if (document.visibilityState === 'visible') sealed({ t: 'visible' }) }, 10000)
  return {
    start: connect,
    async gate(kind) {
      if (kind === 'pair') {
        const cred = await navigator.credentials.create({ publicKey: {
          challenge: crypto.getRandomValues(new Uint8Array(32)),
          rp: { name: 'Claudeflow', id: location.hostname },
          user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'Claudeflow phone', displayName: 'Claudeflow' },
          pubKeyCredParams: [{ type: 'public-key', alg: -7 }],
          authenticatorSelection: { userVerification: 'required', residentKey: 'preferred' },
          attestation: 'none',
        } }).catch(() => undefined)
        if (!cred) return gate(`<h2>Pair this phone</h2><p>The passkey wasn't created.</p><button class="btn yes" data-gate="pair">Try again</button>`)
        pairing.credentialId = b.enc(cred.rawId)
        save()
        const proof = await Seal.pairingProof(pairing.secret ?? '', pairing.key.pub)
        await hello({ proof, registration: { credentialId: pairing.credentialId, publicKey: b.enc(cred.response.getPublicKey()), clientDataJSON: b.enc(cred.response.clientDataJSON) } })
        return
      }
      if (kind === 'unlock' && unlockChallenge) {
        const assertion = await assert(unlockChallenge).catch(() => undefined)
        if (assertion) await sealed({ t: 'unlock', assertion })
        else gate(`<h2>Locked</h2><p>Unlock with your passkey to see your sessions.</p><button class="btn yes" data-gate="unlock">Unlock</button>`)
      }
    },
    async send(command) {
      let assertion
      if (command.kind === 'permission' && command.decision === 'allow') {
        if (!allowChallenge) { prefetch(); return false }
        assertion = await assert(allowChallenge).catch(() => undefined)
        allowChallenge = undefined
        if (!assertion) return false
      }
      await sealed({ t: 'command', command, assertion })
      prefetch()
      return true
    },
  }
}

/** Which page this is: opened from a relay pairing link (#m=…), already paired through one, or on the Mac's own bridge. */
function pickTransport() {
  const h = new URLSearchParams(location.hash.slice(1))
  let pairing = keep.get('cf:pair', null)
  if (h.get('m') && h.get('k')) {
    // The fragment stays in the address: Add to Home Screen keeps it, so the Home Screen app can pair once too.
    if (!pairing || pairing.mac !== h.get('m') || !pairing.credentialId) pairing = { mac: h.get('m'), macPub: h.get('k'), secret: h.get('s'), phone: Seal.randomId() }
    keep.set('cf:pair', pairing)
  }
  return pairing ? relayTransport(pairing) : localTransport()
}
const transport = pickTransport()
transport.start()
setInterval(() => { if (document.visibilityState === 'visible') render() }, 10000)
// A phone wakes the page without a reconnect: check the line when it comes back.
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') render() })
</script>
</body>
</html>
